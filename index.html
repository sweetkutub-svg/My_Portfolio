<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="google-site-verification" content="mOUIY4-0SyJKU-5f5qzlYXudaRZwT8oI6e9zccimovU" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sk Kutubuddin — Web Developer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
        :root {
            --ac: #0a84ff;
            --onac: #fff;
            --win: rgba(34, 34, 36, .9);
            --tb: rgba(54, 54, 57, .92);
            --sf: rgba(40, 40, 44, .72);
            --sf2: rgba(255, 255, 255, .06);
            --sf3: rgba(255, 255, 255, .11);
            --tx: #f5f5f7;
            --mu: rgba(235, 235, 245, .6);
            --bd: rgba(255, 255, 255, .1);
            --mb: rgba(18, 18, 30, .32);
            --mbt: #fff;
            --sh: 0 0 0 .5px rgba(0, 0, 0, .55), 0 22px 70px rgba(0, 0, 0, .55), 0 4px 14px rgba(0, 0, 0, .3)
        }

        body.light {
            --win: rgba(246, 246, 247, .92);
            --tb: rgba(236, 236, 238, .96);
            --sf: rgba(246, 246, 248, .74);
            --sf2: rgba(0, 0, 0, .04);
            --sf3: rgba(0, 0, 0, .08);
            --tx: #1d1d1f;
            --mu: rgba(60, 60, 67, .62);
            --bd: rgba(0, 0, 0, .1);
            --mb: rgba(255, 255, 255, .38);
            --mbt: #1d1d1f;
            --sh: 0 0 0 .5px rgba(0, 0, 0, .3), 0 22px 60px rgba(0, 0, 0, .3), 0 4px 12px rgba(0, 0, 0, .15)
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, system-ui, sans-serif;
            color: var(--tx);
            font-size: 13px;
            background: #000;
            -webkit-font-smoothing: antialiased
        }

        .ic {
            width: 1.15em;
            height: 1.15em;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0
        }

        .ai {
            display: block;
            flex-shrink: 0
        }

        #wall {
            position: fixed;
            inset: -2%;
            transition: transform .4s ease-out, filter .6s
        }

        .wl {
            position: absolute;
            inset: 0;
            display: none
        }

        .wl svg {
            width: 100%;
            height: 100%;
            display: block
        }

        body[data-w="0"] .wl0,
        body[data-w="1"] .wl1,
        body[data-w="2"] .wl2 {
            display: block
        }

        body:not(.light) #wall {
            filter: brightness(.78) saturate(1.05)
        }

        body.light #wall {
            filter: brightness(1.18) saturate(.95)
        }

        /* boot + login */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 56px;
            color: #fff;
            transition: opacity .8s
        }

        #boot svg {
            width: 84px;
            height: 84px;
            fill: #fff
        }

        .pb {
            width: 200px;
            height: 5px;
            border-radius: 5px;
            background: #3a3a3c;
            overflow: hidden
        }

        .pb i {
            display: block;
            height: 100%;
            width: 0;
            background: #fff;
            border-radius: 5px;
            animation: pbf 2.1s cubic-bezier(.4, .1, .4, 1) forwards
        }

        @keyframes pbf {
            to {
                width: 100%
            }
        }

        #lock {
            position: fixed;
            inset: 0;
            z-index: 9990;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 7vh 0 9vh;
            background: rgba(0, 0, 0, .2);
            backdrop-filter: blur(34px) saturate(1.3);
            color: #fff;
            text-align: center;
            text-shadow: 0 1px 12px rgba(0, 0, 0, .3);
            transition: opacity .6s, transform .6s, backdrop-filter .6s
        }

        #lock.out {
            opacity: 0;
            transform: scale(1.08);
            backdrop-filter: blur(0)
        }

        #ld {
            font-size: 1.5rem;
            font-weight: 500;
            opacity: .9
        }

        #lt {
            font-size: clamp(5rem, 13vw, 8.8rem);
            font-weight: 600;
            letter-spacing: -2px;
            line-height: 1;
            margin-top: -4px
        }

        .av {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            margin: 0 auto 12px;
            overflow: hidden;
            box-shadow: 0 0 0 .5px rgba(255, 255, 255, .3), 0 8px 28px rgba(0, 0, 0, .4);
            background: #555
        }

        .av img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            display: block
        }

        .pw {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 220px;
            margin: 14px auto 0;
            padding: 7px 8px 7px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, .22);
            backdrop-filter: blur(20px);
            font-size: .85rem;
            text-shadow: none;
            border: .5px solid rgba(255, 255, 255, .25)
        }

        .pw span {
            flex: 1;
            text-align: left;
            opacity: .75
        }

        .pw b {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .35);
            display: flex;
            align-items: center;
            justify-content: center
        }

        /* menubar */
        #mb {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 28px;
            background: var(--mb);
            backdrop-filter: blur(40px) saturate(1.8);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            z-index: 6000;
            color: var(--mbt);
            font-size: 13px;
            transform: translateY(-100%);
            transition: transform .6s cubic-bezier(.2, .8, .2, 1)
        }

        body.in #mb {
            transform: none
        }

        .mbg {
            display: flex;
            align-items: center;
            height: 100%
        }

        .mi {
            height: 22px;
            padding: 0 9px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap
        }

        .mi.on,
        .mi:hover {
            background: rgba(255, 255, 255, .2)
        }

        body.light .mi.on,
        body.light .mi:hover {
            background: rgba(0, 0, 0, .1)
        }

        .mi svg.fa {
            fill: currentColor
        }

        .mi .ic {
            stroke-width: 1.8
        }

        .b {
            font-weight: 700
        }

        .dd {
            position: fixed;
            z-index: 6100;
            min-width: 230px;
            padding: 5px;
            border-radius: 10px;
            background: var(--sf);
            backdrop-filter: blur(40px) saturate(1.8);
            box-shadow: var(--sh);
            border: .5px solid var(--bd);
            display: none;
            font-size: 13px
        }

        .dd.on {
            display: block
        }

        .dd div {
            padding: 4px 11px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            gap: 24px
        }

        .dd div:hover:not(.dis) {
            background: var(--ac);
            color: var(--onac)
        }

        .dd .dis {
            opacity: .4
        }

        .dd hr {
            border: 0;
            border-top: 1px solid var(--bd);
            margin: 5px 8px
        }

        /* desktop icons */
        body:not(.in) #icons {
            opacity: 0
        }

        #icons {
            transition: opacity .6s;
            position: fixed;
            top: 40px;
            right: 12px;
            bottom: 110px;
            display: flex;
            flex-direction: column;
            flex-wrap: wrap-reverse;
            gap: 10px;
            align-content: flex-start
        }

        .di {
            width: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 3px;
            cursor: default;
            font-size: .75rem;
            text-align: center;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .8)
        }

        .di svg {
            border-radius: 8px
        }

        .di span {
            padding: 1px 6px;
            border-radius: 4px;
            line-height: 1.3
        }

        .di.sel svg {
            background: rgba(255, 255, 255, .22)
        }

        .di.sel span {
            background: var(--ac);
            text-shadow: none;
            color: var(--onac)
        }

        /* windows */
        .win {
            position: fixed;
            display: flex;
            flex-direction: column;
            background: var(--win);
            backdrop-filter: blur(50px) saturate(1.8);
            border-radius: 11px;
            box-shadow: var(--sh);
            resize: both;
            overflow: hidden;
            min-width: 340px;
            min-height: 220px;
            animation: wo .28s cubic-bezier(.2, .9, .25, 1.05)
        }

        @keyframes wo {
            from {
                opacity: 0;
                transform: scale(.86)
            }
        }

        .win:not(.act) {
            box-shadow: 0 0 0 .5px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .28)
        }

        .win.anim {
            transition: left .38s cubic-bezier(.3, .8, .3, 1), top .38s cubic-bezier(.3, .8, .3, 1), width .38s cubic-bezier(.3, .8, .3, 1), height .38s cubic-bezier(.3, .8, .3, 1)
        }

        .win.min {
            visibility: hidden;
            pointer-events: none
        }

        .tb {
            position: relative;
            display: flex;
            align-items: center;
            height: 38px;
            padding-left: 13px;
            flex-shrink: 0;
            background: var(--tb);
            border-bottom: .5px solid var(--bd)
        }

        .tb .t {
            position: absolute;
            left: 90px;
            right: 90px;
            text-align: center;
            font-weight: 600;
            font-size: .8rem;
            pointer-events: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: .5
        }

        .win.act .tb .t {
            opacity: .9
        }

        .tl {
            display: flex;
            gap: 8px;
            z-index: 2
        }

        .tl i {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #58585b;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .25)
        }

        .win.act .tl i:nth-child(1) {
            background: #ff5f57
        }

        .win.act .tl i:nth-child(2) {
            background: #febc2e
        }

        .win.act .tl i:nth-child(3) {
            background: #28c840
        }

        .tl svg {
            width: 8px;
            height: 8px;
            stroke: rgba(0, 0, 0, .6);
            stroke-width: 2.4;
            fill: none;
            opacity: 0;
            transition: opacity .1s
        }

        .tl:hover svg {
            opacity: 1
        }

        .wb {
            flex: 1;
            overflow: auto;
            padding: 1.5rem 1.7rem 1.7rem;
            user-select: text;
            -webkit-user-select: text;
            line-height: 1.55;
            scrollbar-width: thin
        }

        .wb h2 {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -.3px
        }

        .wb h3 {
            font-size: .95rem;
            font-weight: 600;
            margin: 1.1rem 0 .5rem
        }

        .wb p,
        .mu {
            color: var(--mu)
        }

        .wb a {
            color: var(--ac);
            text-decoration: none
        }

        .card {
            background: var(--sf2);
            border: .5px solid var(--bd);
            border-radius: 10px;
            padding: .85rem 1rem;
            margin: .4rem 0;
            transition: background .15s, transform .2s
        }

        .card:hover {
            background: var(--sf3)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
            gap: .8rem
        }

        .bar {
            height: 5px;
            border-radius: 9px;
            background: var(--sf3);
            overflow: hidden;
            margin: .35rem 0 .9rem
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--ac);
            border-radius: 9px;
            width: 0;
            transition: width 1.1s cubic-bezier(.2, .8, .2, 1)
        }

        .row {
            display: flex;
            justify-content: space-between;
            font-size: .82rem
        }

        .pi {
            position: relative;
            aspect-ratio: 16/9;
            border-radius: 7px;
            overflow: hidden;
            margin-bottom: .7rem;
            background: #000
        }

        .pi img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity .4s, transform .6s
        }

        .pi img+img {
            opacity: 0
        }

        .card:hover .pi img:first-child {
            opacity: 0
        }

        .card:hover .pi img+img {
            opacity: 1;
            transform: scale(1.04)
        }

        .tag {
            display: inline-block;
            font-size: .66rem;
            padding: 2px 8px;
            border-radius: 9px;
            background: var(--sf3);
            color: var(--mu);
            margin: 0 4px 4px 0
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: .38rem .95rem;
            border-radius: 6px;
            background: var(--ac);
            color: var(--onac) !important;
            font-weight: 500;
            font-size: .8rem;
            margin: .4rem .4rem 0 0;
            border: 0;
            box-shadow: 0 .5px 1px rgba(0, 0, 0, .3), inset 0 .5px 0 rgba(255, 255, 255, .25)
        }

        .btn.g {
            background: var(--sf3);
            color: var(--tx) !important;
            box-shadow: inset 0 0 0 .5px var(--bd)
        }

        .btn:active {
            filter: brightness(.85)
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff
        }

        .tln {
            padding-left: 22px;
            border-left: 2px solid var(--sf3);
            margin-left: 6px
        }

        .tln .card {
            position: relative
        }

        .tln .card::before {
            content: "";
            position: absolute;
            left: -30px;
            top: 18px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--ac);
            box-shadow: 0 0 0 4px var(--win)
        }

        .sw {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 9px;
            box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .25);
            outline: 2px solid transparent;
            outline-offset: 2px
        }

        .sw.on {
            outline-color: var(--mu)
        }

        .wp {
            width: 110px;
            height: 68px;
            border-radius: 7px;
            display: inline-block;
            margin-right: 10px;
            border: 2px solid transparent;
            outline: .5px solid var(--bd)
        }

        .wp.on {
            border-color: var(--ac)
        }

        .ap {
            display: inline-block;
            text-align: center;
            margin-right: 14px;
            font-size: .75rem
        }

        .ap i {
            display: block;
            width: 82px;
            height: 56px;
            border-radius: 7px;
            margin-bottom: 5px;
            border: 2px solid transparent;
            outline: .5px solid var(--bd)
        }

        .ap.on i {
            border-color: var(--ac)
        }

        .fl {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: .82rem
        }

        .fl:hover {
            background: var(--sf3)
        }

        .fd {
            display: flex;
            height: 100%
        }

        .fsb {
            width: 170px;
            padding: 14px 10px;
            background: var(--sf2);
            border-right: .5px solid var(--bd);
            flex-shrink: 0;
            font-size: .8rem
        }

        .fsb small {
            display: block;
            color: var(--mu);
            font-weight: 600;
            font-size: .68rem;
            margin: 0 8px 6px
        }

        .fsb div {
            padding: 5px 8px;
            border-radius: 6px;
            margin-bottom: 2px
        }

        .fsb div.on {
            background: var(--sf3)
        }

        .fmain {
            flex: 1;
            overflow: auto;
            padding: 1.2rem 1.4rem
        }

        @media(max-width:600px) {
            .fsb {
                display: none
            }
        }

        .sbr {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 14px;
            background: var(--tb);
            border-bottom: .5px solid var(--bd);
            color: var(--mu)
        }

        .url {
            flex: 1;
            max-width: 380px;
            margin: 0 auto;
            padding: 4px 12px;
            border-radius: 7px;
            background: var(--sf2);
            text-align: center;
            font-size: .78rem;
            color: var(--tx);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px
        }

        #term {
            font-family: Menlo, "SF Mono", Consolas, monospace;
            font-size: .78rem;
            background: rgba(22, 22, 24, .96);
            color: #e8e8e8;
            height: 100%;
            overflow: auto;
            padding: 10px 12px;
            line-height: 1.5
        }

        #term input {
            background: none;
            border: 0;
            outline: 0;
            color: #e8e8e8;
            font: inherit;
            width: 60%;
            user-select: text
        }

        .hl {
            color: #5ac8fa
        }

        .gr {
            color: #32d74b
        }

        /* dock */
        #dock {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translate(-50%, 160%);
            height: 70px;
            padding: 0 9px 7px;
            display: flex;
            align-items: flex-end;
            gap: 5px;
            border-radius: 24px;
            background: rgba(255, 255, 255, .17);
            backdrop-filter: blur(30px) saturate(1.9);
            border: .5px solid rgba(255, 255, 255, .3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, .35), inset 0 .5px 0 rgba(255, 255, 255, .35);
            z-index: 5500;
            transition: transform .8s cubic-bezier(.2, .9, .25, 1) .15s
        }

        body.in #dock {
            transform: translateX(-50%)
        }

        body.light #dock {
            background: rgba(255, 255, 255, .4)
        }

        .dk {
            --s: 54px;
            width: var(--s);
            height: var(--s);
            position: relative;
            flex-shrink: 0
        }

        .dk>svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 3px 5px rgba(0, 0, 0, .35))
        }

        .dk.sm {
            transition: width .18s, height .18s
        }

        .dk .tip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 11px;
            border-radius: 7px;
            background: rgba(40, 40, 44, .88);
            backdrop-filter: blur(20px);
            color: #fff;
            font-size: .78rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            border: .5px solid rgba(255, 255, 255, .18);
            transition: opacity .12s
        }

        .dk:hover .tip {
            opacity: 1
        }

        .dk.run::after {
            content: "";
            position: absolute;
            bottom: -6px;
            left: 50%;
            margin-left: -2px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--mbt);
            opacity: .85
        }

        body:not(.light) .dk.run::after {
            background: #fff
        }

        .sep {
            width: 1px;
            height: 46px;
            background: rgba(255, 255, 255, .28);
            margin: 0 3px 3px;
            flex-shrink: 0
        }

        /* launchpad / spotlight / cc */
        #lp {
            position: fixed;
            inset: 0;
            z-index: 5400;
            background: rgba(10, 10, 20, .35);
            backdrop-filter: blur(46px) saturate(1.5);
            display: none;
            flex-direction: column;
            align-items: center;
            padding-top: 64px;
            opacity: 0;
            transition: opacity .3s
        }

        #lp.on {
            opacity: 1
        }

        #lp .s {
            width: 230px;
            padding: 5px 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, .18);
            border: .5px solid rgba(255, 255, 255, .25);
            display: flex;
            gap: 8px;
            align-items: center;
            color: #fff;
            font-size: .85rem
        }

        #lp .s input {
            background: none;
            border: 0;
            outline: 0;
            color: #fff;
            font: inherit;
            flex: 1;
            user-select: text
        }

        #lp .s input::placeholder {
            color: rgba(255, 255, 255, .7)
        }

        #lg {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 40px 10px;
            width: min(980px, 92vw);
            margin-top: 60px;
            color: #fff
        }

        @media(max-width:700px) {
            #lg {
                grid-template-columns: repeat(3, 1fr)
            }
        }

        .la {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-size: .8rem;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .5);
            animation: li .45s cubic-bezier(.2, .9, .25, 1) both;
            text-align: center
        }

        .la:active svg {
            filter: brightness(.7)
        }

        @keyframes li {
            from {
                opacity: 0;
                transform: scale(1.18)
